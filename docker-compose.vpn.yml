# VPN overlay: backend shares Gluetun's network stack (all outbound via WireGuard).
# Requires .env.vpn (generate: bash scripts/setup-vpn-env-from-wg.sh)
# Use with prod overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.vpn.yml --env-file .env.vpn up -d
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: ollama-hack-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY}
      - WIREGUARD_ENDPOINT_IP=${WIREGUARD_ENDPOINT_IP}
      - WIREGUARD_ENDPOINT_PORT=${WIREGUARD_ENDPOINT_PORT}
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/16,172.16.0.0/12,10.0.0.0/8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000/tcp"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "ping", "-c", "1", "1.1.1.1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    ports: !reset []
    expose: !reset []
    networks: !reset []
    extra_hosts: !reset []