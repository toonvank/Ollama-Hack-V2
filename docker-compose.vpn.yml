# VPN overlay: backend shares Gluetun's network stack (all outbound via WireGuard).
# Requires .env.vpn (generate: bash scripts/setup-vpn-env-from-wg.sh)
# Use with prod overlay:
#   bash scripts/compose-prod.sh up -d
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: ollama-hack-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY}
      - WIREGUARD_ENDPOINT_IP=${WIREGUARD_ENDPOINT_IP}
      - WIREGUARD_ENDPOINT_PORT=${WIREGUARD_ENDPOINT_PORT}
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/16,172.16.0.0/12,10.0.0.0/8
      - HTTP_CONTROL_SERVER_ADDRESS=:9998
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000/tcp"
    restart: always
    labels:
      - autoheal=true
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "ping", "-c", "1", "1.1.1.1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  backend:
    network_mode: "service:gluetun"
    restart: always
    depends_on:
      gluetun:
        condition: service_healthy
    ports: !reset []
    expose: !reset []
    networks: !reset []
    extra_hosts: !reset []

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: ollama-hack-autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-network