# VPN overlay: backend shares Gluetun's network — all outbound (probes, HTTP, TCP) via WireGuard.
# API published on gluetun :8000. Requires .env.vpn (bash scripts/setup-vpn-env-from-wg.sh)
#   bash scripts/compose-prod.sh up -d
# Rollback:
#   bash scripts/vpn-rollback.sh
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: ollama-hack-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY}
      - WIREGUARD_ENDPOINT_IP=${WIREGUARD_ENDPOINT_IP}
      - WIREGUARD_ENDPOINT_PORT=${WIREGUARD_ENDPOINT_PORT}
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/16,172.16.0.0/12,10.0.0.0/8
      - HTTP_CONTROL_SERVER_ADDRESS=:9998
      - HEALTH_TARGET_ADDRESSES=1.1.1.1:443,8.8.8.8:443
      - HEALTH_ICMP_TARGET_IPS=1.1.1.1,8.8.8.8
      - HEALTH_VPN_DURATION_INITIAL=45s
    ports:
      - "8000:8000/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    labels:
      - autoheal=true
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "ping", "-c", "1", "-W", "3", "1.1.1.1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s

  backend:
    network_mode: "service:gluetun"
    restart: always
    depends_on:
      gluetun:
        condition: service_healthy
    ports: !reset []
    expose: !reset []
    networks: !reset []
    extra_hosts: !reset []

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: ollama-hack-autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=60
      - AUTOHEAL_START_PERIOD=180
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-network

networks:
  app-network:
    driver: bridge